name: Vitals regression tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt shared-library dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libopengl0
      - run: python -m pip install PyQt6 psutil
      - run: python -m unittest discover -s tests -v
